name: Verify Deplexo auto-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional commit SHA for a manual rebuild"
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Deplexo app and recent deployments
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          APP_SLUG: merry-cascade-8098
          BASE: https://deplexo.com/user/api/v1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLEXO_TOKEN:-}" ]]; then
            echo "::error::DEPLEXO_TOKEN secret is missing."
            exit 1
          fi
          APPS_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/me")"
          APP_ID="$(printf '%s' "$APPS_RESPONSE" | jq -r --arg slug "$APP_SLUG" '
            first(.apps[]? | select(((.name // "") == $slug) or ((((.url // .domain // "") | tostring) | contains($slug)))) | (.id // .appId)) // empty
          ')"
          if [[ -z "$APP_ID" || "$APP_ID" == "null" ]]; then
            echo "::error::Could not find target app '$APP_SLUG'."
            printf '%s' "$APPS_RESPONSE" | jq '{apps: [.apps[]? | {id,appId,name,url,domain,status}]}'
            exit 1
          fi
          echo "Target app found: $APP_SLUG ($APP_ID)"
          HISTORY="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/apps/$APP_ID/deployments?limit=10&offset=0")"
          printf '%s' "$HISTORY" | jq '{deployments: [(.data // .deployments // .items // [])[]? | {id,status,state,commitSha,commit_sha,createdAt,created_at,startedAt,finishedAt,error}]}'
          if curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/apps/$APP_ID/live-stats" -o /tmp/deplexo-live.json; then
            echo "App live stats:"
            jq '{status,cpu,memory,restarts,uptime,data}' /tmp/deplexo-live.json
          fi
          if curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/apps/$APP_ID/logs/runtime?limit=1000" -o /tmp/deplexo-runtime.json; then
            echo "Recent monitor diagnostics:"
            jq -r '(.lines // [])[]? | if type == "string" then . else (.message // .line // .text // tostring) end' /tmp/deplexo-runtime.json | grep -Ei 'monitor_started|monitor_summary|liqs_5m|liquidation|poll_failed|nodeflare_ws|telegram|error|warn' | tail -n 80 || true
          fi

      - name: Request manual Deplexo rebuild
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          APP_SLUG: merry-cascade-8098
          BASE: https://deplexo.com/user/api/v1
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          APPS_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/me")"
          APP_ID="$(printf '%s' "$APPS_RESPONSE" | jq -r --arg slug "$APP_SLUG" '
            first(.apps[]? | select(((.name // "") == $slug) or ((((.url // .domain // "") | tostring) | contains($slug)))) | (.id // .appId)) // empty
          ')"
          if [[ -z "$APP_ID" || "$APP_ID" == "null" ]]; then
            echo "::error::Could not find target app '$APP_SLUG'."
            exit 1
          fi
          SHA="${REQUESTED_SHA:-$PUSH_SHA}"
          echo "Requesting manual rebuild for $SHA"
          BODY=""
          STATUS="000"
          for ATTEMPT in $(seq 1 15); do
            RESPONSE="$(curl --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $DEPLEXO_TOKEN" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg sha "$SHA" '{commitSha:$sha}')" \
              -w '\nHTTP_STATUS:%{http_code}' "$BASE/apps/$APP_ID/restart")"
            BODY="${RESPONSE%$'\n'HTTP_STATUS:*}"
            STATUS="${RESPONSE##*HTTP_STATUS:}"
            printf 'Deplexo restart attempt %s/5 returned HTTP %s\n' "$ATTEMPT" "$STATUS"
            if [[ "$STATUS" -ge 200 && "$STATUS" -lt 300 ]]; then
              break
            fi
            if [[ "$STATUS" == "409" ]]; then
              echo "Deplexo reports a deployment already running; will wait and retry without cancelling it."
            fi
            if [[ "$STATUS" -lt 500 && "$STATUS" != "429" ]]; then
              echo "::error::Non-retryable manual rebuild failure with HTTP $STATUS."
              printf '%s' "$BODY" | jq . || printf '%s\n' "$BODY"
              exit 1
            fi
            if [[ "$ATTEMPT" -lt 15 ]]; then
              DELAY=$((ATTEMPT * 10))
              if [[ "$DELAY" -gt 120 ]]; then DELAY=120; fi
              echo "Deplexo request failed with HTTP $STATUS; retry $((ATTEMPT + 1))/15 in ${DELAY}s."
              sleep "$DELAY"
            fi
          done
          printf '%s' "$BODY" | jq . || printf '%s\n' "$BODY"
          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            echo "::error::Manual rebuild failed after 15 attempts with HTTP $STATUS. Deplexo did not accept this commit; deployment is NOT confirmed."
            exit 1
          fi
          echo "Deplexo accepted the manual rebuild request (HTTP $STATUS)."

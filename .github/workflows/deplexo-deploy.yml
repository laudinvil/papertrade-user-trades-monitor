name: Deploy and verify Deplexo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deplexo-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request one Deplexo redeployment
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          APP_SLUG: merry-cascade-8098
          BASE: https://deplexo.com/user/api/v1
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLEXO_TOKEN:-}" ]]; then
            echo "::error::DEPLEXO_TOKEN secret is missing."
            exit 1
          fi

          APPS_RESPONSE="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" \
            -H "Accept: application/json" "$BASE/me")"
          APP_ID="$(printf '%s' "$APPS_RESPONSE" | jq -r --arg slug "$APP_SLUG" '
            first(.apps[]? | select(((.name // "") == $slug) or ((((.url // .domain // "") | tostring) | contains($slug)))) | (.id // .appId)) // empty
          ')"
          if [[ -z "$APP_ID" || "$APP_ID" == "null" ]]; then
            echo "::error::Could not find Deplexo app '$APP_SLUG'."
            printf '%s' "$APPS_RESPONSE" | jq '{apps: [.apps[]? | {id,appId,name,url,domain,status}]}'
            exit 1
          fi

          echo "Requesting a single rebuild for GitHub commit $PUSH_SHA (app $APP_ID)."
          CODE="000"
          for ATTEMPT in 1 2 3 4 5 6; do
            echo "Deplexo redeployment attempt $ATTEMPT/6 for commit $PUSH_SHA."
            CODE="$(curl --silent --show-error \
              -o /tmp/deplexo-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $DEPLEXO_TOKEN" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data '{}' "$BASE/apps/$APP_ID/restart")" || CODE="000"
            cat /tmp/deplexo-response.json | jq . 2>/dev/null || cat /tmp/deplexo-response.json
            if [[ "$CODE" == "200" || "$CODE" == "201" || "$CODE" == "202" ]]; then
              break
            fi
            if [[ "$CODE" != "503" && "$CODE" != "000" ]]; then
              echo "::error::Deplexo rejected redeployment (HTTP $CODE)."
              if [[ "$CODE" == "403" ]]; then
                echo "::error::Check that DEPLEXO_TOKEN includes app:restart scope."
              fi
              exit 1
            fi
            if [[ "$ATTEMPT" -lt 6 ]]; then
              WAIT=$((ATTEMPT * 10))
              echo "Temporary Deplexo/API unavailability (HTTP $CODE); retrying in ${WAIT}s."
              sleep "$WAIT"
            fi
          done

          if [[ "$CODE" != "200" && "$CODE" != "201" && "$CODE" != "202" ]]; then
            echo "::error::Deplexo did not accept redeployment after 6 attempts (last HTTP $CODE)."
            exit 1
          fi
          echo "Deplexo accepted the redeployment request. Acceptance is not proof that the app is live."
          echo "Requested source commit: $PUSH_SHA"
          echo "Check Deplexo deployment history and runtime before treating this as deployed."

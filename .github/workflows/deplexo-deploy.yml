name: Inspect Deplexo auto-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional commit SHA for a manual diagnostics run"
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Deplexo app and recent deployments
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          APP_SLUG: merry-cascade-8098
          BASE: https://deplexo.com/user/api/v1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLEXO_TOKEN:-}" ]]; then
            echo "::error::DEPLEXO_TOKEN secret is missing."
            exit 1
          fi
          APPS_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/me")"
          APP_ID="$(printf '%s' "$APPS_RESPONSE" | jq -r --arg slug "$APP_SLUG" '
            first(.apps[]? | select(((.name // "") == $slug) or ((((.url // .domain // "") | tostring) | contains($slug))) ) | (.id // .appId)) // empty
          ')"
          if [[ -z "$APP_ID" || "$APP_ID" == "null" ]]; then
            echo "::error::Could not find target app '$APP_SLUG'."
            printf '%s' "$APPS_RESPONSE" | jq '{apps: [.apps[]? | {id,appId,name,url,domain,status}]}'
            exit 1
          fi
          echo "Target app found: $APP_SLUG"
          HISTORY="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/apps/$APP_ID/deployments?limit=10&offset=0")"
          printf '%s' "$HISTORY" | jq '{deployments: [(.data // .deployments // .items // [])[]? | {id,status,state,commitSha,commit_sha,createdAt,created_at,startedAt,finishedAt,error}]}'
          DEPLOY_ID="$(printf '%s' "$HISTORY" | jq -r 'first((.data // .deployments // .items // [])[]?) | .id // empty')"
          if [[ -n "$DEPLOY_ID" ]]; then
            if curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/deployments/$DEPLOY_ID/logs" -o /tmp/deplexo-build.json; then
              echo "Latest deployment build log:"
              jq -r '(.lines // .logs // .data // []) | if type == "array" then .[] else . end | if type == "string" then . else (.message // .line // .text // tostring) end' /tmp/deplexo-build.json | tail -n 100 || true
            fi
          fi
          if curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/apps/$APP_ID/logs/runtime?limit=1000" -o /tmp/deplexo-runtime.json; then
            echo "Runtime diagnostics:"
            jq -r '(.lines // [])[]? | if type == "string" then . else (.message // .line // .text // tostring) end' /tmp/deplexo-runtime.json | grep -Ei 'monitor_started|monitor_summary|liquidation|poll_failed|nodeflare_ws|telegram|error|warn|state' | tail -n 80 || true
          fi
          if curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/apps/$APP_ID/live-stats" -o /tmp/deplexo-live.json; then
            echo "App live stats:"
            jq '{status,cpu,memory,restarts,uptime,data}' /tmp/deplexo-live.json
          fi

      - name: Request Deplexo rebuild without cancelling active deployments
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          BASE: https://deplexo.com/user/api/v1
          APP_ID: ${{ steps.inspect.outputs.APP_ID }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="${REQUESTED_SHA:-$PUSH_SHA}"
          echo "Requesting Deplexo rebuild for commit $SHA"
          RESPONSE="$(curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg sha "$SHA" '{commitSha:$sha}')" \
            -w '\nHTTP_STATUS:%{http_code}' "$BASE/apps/$APP_ID/restart")"
          BODY="${RESPONSE%        if: startsWith(github.event.head_commit.message, 'EMERGENCY STOP MONITOR:')
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          APP_SLUG: merry-cascade-8098
          BASE: https://deplexo.com/user/api/v1
        shell: bash
        run: |
          set -euo pipefail
          APPS_RESPONSE="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/me")"
          APP_ID="$(printf '%s' "$APPS_RESPONSE" | jq -r --arg slug "$APP_SLUG" 'first(.apps[]? | select(((.name // "") == $slug) or ((((.url // .domain // "") | tostring) | contains($slug)))) | (.id // .appId)) // empty')"
          test -n "$APP_ID" && test "$APP_ID" != "null"
          echo "Emergency stop requested for $APP_SLUG"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" --data '{}' "$BASE/apps/$APP_ID/cancel"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" --data '{}' "$BASE/apps/$APP_ID/stop"
          echo "Deplexo stop request accepted."
\n'HTTP_STATUS:*}"
          STATUS="${RESPONSE##*HTTP_STATUS:}"
          printf '%s' "$BODY" | jq . || printf '%s\n' "$BODY"
          if [[ "$STATUS" == "409" ]]; then
            echo "::error::A deployment is already running. No cancellation was attempted; inspect deployment history."
            exit 1
          fi
          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            echo "::error::Deplexo rebuild request failed with HTTP $STATUS."
            exit 1
          fi
          echo "Deplexo accepted the rebuild request (HTTP $STATUS)."

      - name: Emergency stop monitor only for an explicitly marked commit
        if: startsWith(github.event.head_commit.message, 'EMERGENCY STOP MONITOR:')
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          APP_SLUG: merry-cascade-8098
          BASE: https://deplexo.com/user/api/v1
        shell: bash
        run: |
          set -euo pipefail
          APPS_RESPONSE="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/me")"
          APP_ID="$(printf '%s' "$APPS_RESPONSE" | jq -r --arg slug "$APP_SLUG" 'first(.apps[]? | select(((.name // "") == $slug) or ((((.url // .domain // "") | tostring) | contains($slug)))) | (.id // .appId)) // empty')"
          test -n "$APP_ID" && test "$APP_ID" != "null"
          echo "Emergency stop requested for $APP_SLUG"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" --data '{}' "$BASE/apps/$APP_ID/cancel"
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" -H "Content-Type: application/json" --data '{}' "$BASE/apps/$APP_ID/stop"
          echo "Deplexo stop request accepted."

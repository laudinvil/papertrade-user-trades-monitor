name: Deploy and verify Deplexo

# Automatic deployment is handled by Deplexo Auto Deploy.
# Keep this workflow available only for explicit manual recovery.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deplexo-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Request one Deplexo redeployment
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          APP_SLUG: merry-cascade-8098
          BASE: https://deplexo.com/user/api/v1
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLEXO_TOKEN:-}" ]]; then
            echo "::error::DEPLEXO_TOKEN secret is missing."
            exit 1
          fi

          APPS_RESPONSE="$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" \
            -H "Accept: application/json" "$BASE/me")"
          APP_ID="$(printf '%s' "$APPS_RESPONSE" | jq -r --arg slug "$APP_SLUG" '
            first(.apps[]? | select(((.name // "") == $slug) or ((((.url // .domain // "") | tostring) | contains($slug)))) | (.id // .appId)) // empty
          ')"
          if [[ -z "$APP_ID" || "$APP_ID" == "null" ]]; then
            echo "::error::Could not find Deplexo app '$APP_SLUG'."
            printf '%s' "$APPS_RESPONSE" | jq '{apps: [.apps[]? | {id,appId,name,url,domain,status}]}'
            exit 1
          fi

          echo "Requesting a rebuild of the exact GitHub commit $PUSH_SHA (app $APP_ID)."
          CODE="000"
          for ATTEMPT in $(seq 1 20); do
            echo "Deplexo redeployment attempt $ATTEMPT/20 for commit $PUSH_SHA."
            CODE="$(curl --silent --show-error \
              -o /tmp/deplexo-response.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $DEPLEXO_TOKEN" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data "$(jq -cn --arg sha "$PUSH_SHA" '{commitSha:$sha}')" "$BASE/apps/$APP_ID/restart")" || CODE="000"
            cat /tmp/deplexo-response.json | jq . 2>/dev/null || cat /tmp/deplexo-response.json
            if [[ "$CODE" == "200" || "$CODE" == "201" || "$CODE" == "202" ]]; then
              break
            fi
            if [[ "$CODE" != "503" && "$CODE" != "409" && "$CODE" != "000" ]]; then
              echo "::error::Deplexo rejected redeployment (HTTP $CODE)."
              if [[ "$CODE" == "403" ]]; then
                echo "::error::Check that DEPLEXO_TOKEN includes both app:restart and app:deploy scopes; commitSha rebuilds require both."
              fi
              exit 1
            fi
            if [[ "$ATTEMPT" -lt 20 ]]; then
              WAIT=60
              echo "Temporary Deplexo/API unavailability or deployment already in progress (HTTP $CODE); retrying in ${WAIT}s."
              sleep "$WAIT"
            fi
          done

          if [[ "$CODE" != "200" && "$CODE" != "201" && "$CODE" != "202" ]]; then
            echo "::error::Deplexo did not accept redeployment after 20 attempts (last HTTP $CODE)."
            exit 1
          fi
          DEPLOYMENT_ID="$(jq -r '.deploymentId // empty' /tmp/deplexo-response.json)"
          if [[ -z "$DEPLOYMENT_ID" || "$DEPLOYMENT_ID" == "null" ]]; then
            echo "::error::Deplexo accepted the request but returned no deploymentId; cannot verify deployment."
            exit 1
          fi

          echo "Accepted deployment $DEPLOYMENT_ID for requested source commit $PUSH_SHA."
          echo "Polling the exact deployment until it succeeds or fails (maximum 20 minutes)."
          DEPLOY_STATUS=""
          for ATTEMPT in $(seq 1 40); do
            LOG_CODE="$(curl --silent --show-error -o /tmp/deplexo-deployment-logs.json -w '%{http_code}' \
              -H "Authorization: Bearer $DEPLEXO_TOKEN" \
              -H "Accept: application/json" \
              "$BASE/deployments/$DEPLOYMENT_ID/logs")" || LOG_CODE="000"
            if [[ "$LOG_CODE" == "200" ]]; then
              DEPLOY_STATUS="$(jq -r '.status // .deployment.status // empty' /tmp/deplexo-deployment-logs.json)"
              echo "Deployment status: ${DEPLOY_STATUS:-unknown} (poll $ATTEMPT/40)"
              if [[ "$DEPLOY_STATUS" == "success" || "$DEPLOY_STATUS" == "succeeded" || "$DEPLOY_STATUS" == "ready" ]]; then
                break
              fi
              if [[ "$DEPLOY_STATUS" == "failed" || "$DEPLOY_STATUS" == "error" || "$DEPLOY_STATUS" == "cancelled" ]]; then
                jq '{status, errorMessage, buildLogs}' /tmp/deplexo-deployment-logs.json 2>/dev/null || cat /tmp/deplexo-deployment-logs.json
                echo "::error::Deplexo deployment $DEPLOYMENT_ID ended with status '$DEPLOY_STATUS'."
                exit 1
              fi
            else
              echo "Could not read deployment status yet (HTTP $LOG_CODE; poll $ATTEMPT/40)."
              cat /tmp/deplexo-deployment-logs.json 2>/dev/null || true
            fi
            if [[ "$ATTEMPT" -lt 40 ]]; then sleep 30; fi
          done

          if [[ "$DEPLOY_STATUS" != "success" && "$DEPLOY_STATUS" != "succeeded" && "$DEPLOY_STATUS" != "ready" ]]; then
            echo "::error::Deployment did not reach a confirmed successful status within 20 minutes."
            exit 1
          fi

          echo "Build/deployment reports success. Checking runtime logs for the required v33 closed-PnL monitor."
          RUNTIME_OK="false"
          for ATTEMPT in $(seq 1 12); do
            RUNTIME_CODE="$(curl --silent --show-error -o /tmp/deplexo-runtime.json -w '%{http_code}' \
              -H "Authorization: Bearer $DEPLEXO_TOKEN" \
              -H "Accept: application/json" \
              "$BASE/apps/$APP_ID/logs/runtime?limit=1000")" || RUNTIME_CODE="000"
            if [[ "$RUNTIME_CODE" == "200" ]]; then
              cat /tmp/deplexo-runtime.json | jq -r '.lines[]? | if type == "string" then . else tostring end' > /tmp/deplexo-runtime-lines.txt
              if grep -q 'papertrade-closed-pnl-5m-v33-loss-majority-period-boundary' /tmp/deplexo-runtime-lines.txt; then
                RUNTIME_OK="true"
                break
              fi
            else
              echo "Runtime log read returned HTTP $RUNTIME_CODE (check $ATTEMPT/12)."
            fi
            if [[ "$ATTEMPT" -lt 12 ]]; then sleep 10; fi
          done

          if [[ "$RUNTIME_OK" != "true" ]]; then
            echo "::error::Deployment reports success, but runtime logs do not confirm the required v33 closed-PnL monitor started."
            echo "Recent runtime response:"
            jq '{lines, nextSince}' /tmp/deplexo-runtime.json 2>/dev/null || cat /tmp/deplexo-runtime.json 2>/dev/null || true
            exit 1
          fi

          echo "Verified: deployment $DEPLOYMENT_ID succeeded and runtime logs show papertrade-closed-pnl-5m-v33-loss-majority-period-boundary."
          echo "Requested source commit: $PUSH_SHA"

name: Verify Deplexo auto-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional commit SHA for a manual rebuild"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Deplexo app and recent deployments
        id: inspect
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          APP_SLUG: merry-cascade-8098
          BASE: https://deplexo.com/user/api/v1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLEXO_TOKEN:-}" ]]; then
            echo "::error::DEPLEXO_TOKEN secret is missing."
            exit 1
          fi

          APPS_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" \
            -H "Accept: application/json" "$BASE/me")"
          APP_ID="$(printf '%s' "$APPS_RESPONSE" | jq -r --arg slug "$APP_SLUG" '
            first(.apps[]? |
              select(((.name // "") == $slug) or
                (((.url // .domain // "") | tostring) | contains($slug))) |
              (.id // .appId)) // empty
          ')"
          if [[ -z "$APP_ID" || "$APP_ID" == "null" ]]; then
            echo "::error::Could not find target app '$APP_SLUG'."
            printf '%s' "$APPS_RESPONSE" | jq '{apps: [.apps[]? | {id,appId,name,url,domain,status}]}'
            exit 1
          fi
          echo "APP_ID=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Target app found: $APP_SLUG"
          HISTORY="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" \
            -H "Accept: application/json" "$BASE/apps/$APP_ID/deployments?limit=10&offset=0")"
          echo "Recent deployment history (status and commit only):"
          printf '%s' "$HISTORY" | jq '{
            deployments: [(.data // .deployments // .items // [])[]? |
              {id, status, state, commitSha, commit_sha, createdAt, created_at, startedAt, finishedAt, error}]
          }'

          DEPLOY_ID="$(printf '%s' "$HISTORY" | jq -r 'first((.data // .deployments // .items // [])[]?) | .id // empty')"
          if [[ -n "$DEPLOY_ID" ]]; then
            echo "Latest deployment build log (last 100 lines):"
            if curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/deployments/$DEPLOY_ID/logs" -o /tmp/deplexo-build.json; then
              jq -r '(.lines // .logs // .data // []) | if type == "array" then .[] else . end | if type == "string" then . else (.message // .line // .text // tostring) end' /tmp/deplexo-build.json | tail -n 100 || true
            else
              echo "Build logs unavailable for deployment $DEPLOY_ID."
            fi
          fi

          echo "Usage response shape:"
          if [[ -f /tmp/deplexo-usage.json ]]; then jq '{keys:keys, values:with_entries(select(.key | test("usage|limit|plan|period|credit|compute|request"; "i")))}' /tmp/deplexo-usage.json; fi

          echo "Runtime diagnostics (filtered):"
          if curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/apps/$APP_ID/logs/runtime?limit=1000" -o /tmp/deplexo-runtime.json; then
            jq -r '(.lines // [])[]? | if type == "string" then . else (.message // .line // .text // tostring) end' /tmp/deplexo-runtime.json | grep -Ei 'monitor_started|monitor_summary|liqs_5m_alert_sent|poll_failed|nodeflare_ws|telegram|error|warn|state' | tail -n 80 || true
          else
            echo "Runtime logs unavailable; verify DEPLEXO_TOKEN has logs:read scope."
          fi

          echo "Usage summary:"
          if curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/usage" -o /tmp/deplexo-usage.json; then
            jq '{plan, period, usage, limits, remaining, data}' /tmp/deplexo-usage.json
          else
            echo "Usage endpoint unavailable."
          fi

          echo "App live stats:"
          if curl --fail --silent --show-error --max-time 20 -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/apps/$APP_ID/live-stats" -o /tmp/deplexo-live.json; then
            jq '{status, cpu, memory, restarts, uptime, data}' /tmp/deplexo-live.json
          else
            echo "Live stats unavailable."
          fi

      - name: Cancel deployment and stop noisy monitor
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          BASE: https://deplexo.com/user/api/v1
          APP_ID: ${{ steps.inspect.outputs.APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cancelling any active deployment for $APP_ID"
          CANCEL_STATUS="$(curl --silent --show-error -X POST \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{}' \
            -o /tmp/deplexo-cancel.json -w '%{http_code}' "$BASE/apps/$APP_ID/cancel")"
          cat /tmp/deplexo-cancel.json | jq . || cat /tmp/deplexo-cancel.json
          if [[ "$CANCEL_STATUS" -ge 200 && "$CANCEL_STATUS" -lt 300 ]]; then
            echo "Cancellation requested (HTTP $CANCEL_STATUS)."
          else
            echo "Cancel returned HTTP $CANCEL_STATUS; continuing to stop the app."
          fi

          echo "Stopping app $APP_ID to prevent further Telegram spam"
          STOP_STATUS="$(curl --silent --show-error -X POST \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{}' \
            -o /tmp/deplexo-stop.json -w '%{http_code}' "$BASE/apps/$APP_ID/stop")"
          cat /tmp/deplexo-stop.json | jq . || cat /tmp/deplexo-stop.json
          if [[ "$STOP_STATUS" -lt 200 || "$STOP_STATUS" -ge 300 ]]; then
            echo "::error::Failed to stop Deplexo app (HTTP $STOP_STATUS). Check app:stop permission."
            exit 1
          fi
          echo "Deplexo accepted the stop request (HTTP $STOP_STATUS)."

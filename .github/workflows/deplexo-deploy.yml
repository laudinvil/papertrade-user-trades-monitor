name: Verify Deplexo auto-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to verify in Deplexo deployment history"
        required: false
        type: string

permissions:
  contents: read

# New pushes supersede stale verification runs; never leave an old deploy request looping.
concurrency:
  group: deplexo-autodeploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify GitHub push was deployed by Deplexo auto-deploy
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          APP_SLUG: merry-cascade-8098
          BASE: https://deplexo.com/user/api/v1
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          PUSH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DEPLEXO_TOKEN:-}" ]]; then
            echo "::error::DEPLEXO_TOKEN secret is missing."
            exit 1
          fi

          APPS_RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" "$BASE/me")"
          APP_ID="$(printf '%s' "$APPS_RESPONSE" | jq -r --arg slug "$APP_SLUG" '
            first(.apps[]? | select(((.name // "") == $slug) or ((((.url // .domain // "") | tostring) | contains($slug)))) | (.id // .appId)) // empty
          ')"
          if [[ -z "$APP_ID" || "$APP_ID" == "null" ]]; then
            echo "::error::Could not find target app '$APP_SLUG'."
            printf '%s' "$APPS_RESPONSE" | jq '{apps: [.apps[]? | {id,appId,name,url,domain,status}]}'
            exit 1
          fi

          SHA="${REQUESTED_SHA:-$PUSH_SHA}"
          echo "App: $APP_SLUG ($APP_ID)"
          echo "Waiting for Deplexo auto-deploy to publish commit $SHA"
          # Auto-deploy is enabled by the user. Do not call /restart: that manual
          # endpoint was returning HTTP 503 and is not the GitHub auto-deploy path.
          for ATTEMPT in $(seq 1 20); do
            HISTORY="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $DEPLEXO_TOKEN" -H "Accept: application/json" \
              "$BASE/apps/$APP_ID/deployments?limit=20&offset=0")"
            printf '%s' "$HISTORY" | jq -r '
              (.data // .deployments // .items // [])[]? |
              "deployment id=\(.id // "unknown") status=\(.status // .state // "unknown") sha=\(.commitSha // .commit_sha // "unknown") created=\(.createdAt // .created_at // "unknown")"
            '
            if printf '%s' "$HISTORY" | jq -e --arg sha "$SHA" '
              any((.data // .deployments // .items // [])[]?;
                ((.commitSha // .commit_sha // "") | ascii_downcase) == ($sha | ascii_downcase)
                and ((.status // .state // "") | ascii_downcase) as $s
                | ($s == "success" or $s == "succeeded" or $s == "deployed" or $s == "running" or $s == "ready")
              )
            ' >/dev/null; then
              echo "Deplexo deployment history confirms commit $SHA."
              exit 0
            fi
            if [[ "$ATTEMPT" -lt 20 ]]; then
              echo "Commit not yet confirmed in Deplexo (check $ATTEMPT/20); waiting 30 seconds."
              sleep 30
            fi
          done

          echo "::error::Deplexo auto-deploy did not confirm commit $SHA after 10 minutes. No manual restart was attempted."
          exit 1

name: Deploy to Deplexo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deplexo-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy exact GitHub commit on Deplexo
        env:
          DEPLEXO_TOKEN: ${{ secrets.DEPLEXO_TOKEN }}
          DEPLEXO_APP_ID: ${{ secrets.DEPLEXO_APP_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLEXO_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret DEPLEXO_TOKEN"
            exit 1
          fi
          if [ -z "${DEPLEXO_APP_ID}" ]; then
            echo "::error::Missing GitHub Actions secret DEPLEXO_APP_ID"
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${DEPLEXO_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"commitSha\":\"${COMMIT_SHA}\"}" \
            "https://deplexo.com/user/api/v1/apps/${DEPLEXO_APP_ID}/restart")"

          echo "Deplexo accepted redeploy request for commit ${COMMIT_SHA}."
          echo "${response}" | jq .
          deployment_id="$(echo "${response}" | jq -r '.deploymentId // .deployment.id // empty')"

          if [ -n "${deployment_id}" ]; then
            echo "DEPLEXO_DEPLOYMENT_ID=${deployment_id}" >> "${GITHUB_STEP_SUMMARY}"
            echo "Requested commit: ${COMMIT_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::Deplexo accepted the request but did not return a recognized deploymentId field. Verify deployment history in Deplexo."
          fi

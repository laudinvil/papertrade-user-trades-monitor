build:
  system: docker
  min_cpu: 0.1
  max_cpu: 0.1
  min_memory: 256
  max_memory: 256

dockerfile_path: "./Dockerfile"
working_directory: "/"
build_context_directory: "/"
start_command: "node supervisor.js"

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.1
  min_memory: 256
  max_memory: 256
  min_replicas: 1
  max_replicas: 1

health_check:
  type: tcp
  interval_in_seconds: 10
